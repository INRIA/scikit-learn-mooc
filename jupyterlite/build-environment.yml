# Host environment needed to *build* the JupyterLite site (not the kernel
# environment, see environment.yml for that).
#
#   conda env create -f jupyterlite/build-environment.yml
#   conda activate scikit-learn-course-jupyterlite
#   make jupyterlite
name: scikit-learn-course-jupyterlite
channels:
  - conda-forge
dependencies:
  - python
  - jupyterlite-core
  - jupyterlite-xeus
  # needed by jupyterlite to index the notebooks and datasets
  - jupyter_server
  # used by jupyterlite-xeus to solve the emscripten kernel environment
  - micromamba
