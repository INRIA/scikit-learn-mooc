# Python environment of the in-browser (xeus-python) kernel.
#
# These packages are resolved for the emscripten-wasm32 platform at build time
# and shipped with the JupyterLite site, so they can be imported directly from
# the notebooks without any `%pip install`.
#
# Keep in sync with the top-level requirements.txt (minus the host-only
# packages: jupyterlab, notebook, IPython).
name: xeus-python-kernel
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - scikit-learn ==1.8
  - pandas >=1,<3
  - matplotlib >=3.10
  # seaborn-base rather than seaborn: the seaborn metapackage also pulls
  # statsmodels, which is unused in the course and adds many wasm modules that
  # the kernel preloads at startup (Firefox runs out of executable memory).
  - seaborn-base >=0.13
  - plotly
  - skrub
  - numpy <2.4.3  # required for pandas to work
  - nbformat>=4.2.0
